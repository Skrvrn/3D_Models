<!doctype html>
<html lang="en">
  <style>
    /* Сброс отступов */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background: #ffffff;
    }

    /* Скрываем значок мобильного телефона */
    #ar-prompt {
      display: none;
    }

    /* Делаем 3D плеер на весь браузер */
    model-viewer {
      height: 100vh;
      width: 100%;
    }
  </style>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Viewer</title>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"
    ></script>
  </head>
  <body>
    <model-viewer
      src="Angar_naves_.glb"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      tone-mapping="neutral"
      poster="poster.webp"
      shadow-intensity="1"
      auto-rotate
      exposure="1.5"
      camera-orbit="-235.5deg 88.52deg 52.18m"
      field-of-view="13.48deg"
    >
      <div class="progress-bar hide" slot="progress-bar">
        <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">View in your space</button>
      <div id="ar-prompt">
        <img src="https://modelviewer.dev/shared-assets/icons/hand.png" />
      </div>
    </model-viewer>
  </body>
</html>
